server:
  port: 8090

spring:
  config:
    import: optional:file:./application-local.yml
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/online_exam?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root123456
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: EXAMHikariPool
  main:
    allow-circular-references: true

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    auto-mapping-behavior: full
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      logic-delete-field: isDeleted

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: exam-system-bucket

  # AI 服务配置
kimi:
  api:
    base-url: https://api.moonshot.cn/v1/chat/completions
    api-key: ${KIMI_API_KEY:}   # 真实值放 application-local.yml 或环境变量
    #    model: kimi-k2-thinking-turbo  # 使用8k上下文模型进行判卷
    model: moonshot-v1-32k  # 使用8k上下文模型进行判卷
    max-tokens: 8192  # 最大生成token数
    temperature: 0.3  # 较低的temperature确保判卷结果稳定

management:
  endpoints:
    web:
      exposure:
        include: health,info