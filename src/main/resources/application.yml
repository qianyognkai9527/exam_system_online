server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/online_exam?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root123456
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 60000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 60000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      maximum-pool-size: 8 #连接池最大连接数，默认是10
      minimum-idle: 8 #最小空闲连接数量
      pool-name: EXAMHikariPool # 连接池名称
  main:
    allow-circular-references: true

#用于打印框架生成的sql语句，便于调试
mybatis-plus:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    auto-mapping-behavior: full
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      logic-delete-field: isDeleted

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: exam-system-bucket

  # AI 服务配置
kimi:
  api:
    base-url: https://api.moonshot.cn/v1/chat/completions
    api-key: sk-sX3N2fihXZctt4oBrXvFiKh6b3pVuhuAxLTVOS1CHWRylhpy  # 从环境变量获取，或使用默认值
    #    model: kimi-k2-thinking-turbo  # 使用8k上下文模型进行判卷
    model: moonshot-v1-32k  # 使用8k上下文模型进行判卷
    max-tokens: 8192  # 最大生成token数
    temperature: 0.3  # 较低的temperature确保判卷结果稳定